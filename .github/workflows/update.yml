name: Update ASN/IP data

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/update_data.py"
      - "scripts/enrich_threat_intel.py"
      - ".github/workflows/update.yml"

permissions:
  contents: write

concurrency:
  group: asn-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pytricia

      - name: Update datasets
        run: |
          python scripts/update_data.py
          python scripts/enrich_threat_intel.py

      - name: Replace generated data with fresh snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes"
            exit 0
          fi
          git commit -m "Update ASN/IP ownership data"

          # Generated CSVs are snapshots, not mergeable source files.
          # Rebase is intentionally avoided because it can create conflicts
          # when the same generated files changed on main while this job ran.
          for attempt in 1 2 3; do
            git fetch origin main
            if git merge-base --is-ancestor origin/main HEAD; then
              if git push origin HEAD:main; then
                exit 0
              fi
            else
              echo "main advanced while data was generated; rebuilding from latest main"
              git reset --hard origin/main
              python scripts/update_data.py
              python scripts/enrich_threat_intel.py
              git add data/
              if git diff --cached --quiet; then
                echo "No data changes after refresh"
                exit 0
              fi
              git commit -m "Update ASN/IP ownership data"
            fi
            echo "Push attempt $attempt failed; retrying..."
            sleep 5
          done
          echo "Unable to publish generated data after 3 attempts"
          exit 1
